AWSTemplateFormatVersion: '2010-09-09'
Description: Lets GitHub Actions deploy the planscope-api stack, with no stored AWS keys

Parameters:
  GitHubRepo:
    Type: String
    Default: samaddmirzaa/london-planscope
  ArtifactsBucket:
    Type: String
    Description: SAM's managed bucket, shown in the sam deploy output
  ImageRepository:
    Type: String
    Description: The API's ECR repository name, shown in the sam deploy output
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  # Lets AWS trust identity tokens issued by GitHub Actions (one per account)
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Private home for the model files, which are not in git
  ModelBucket:
    Type: AWS::S3::Bucket

  # Used only by CloudFormation to create and change the stack's resources
  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess'

  # Assumed by GitHub Actions, but only from the main branch of this repository
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepo}:ref:refs/heads/main'
      Policies:
        - PolicyName: deploy-planscope-api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Hand the CloudFormation role (and no other) to CloudFormation
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationRole.Arn
              # Create, run and watch change sets (the list SAM's own pipeline setup uses)
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:DescribeStackResource
                Resource: '*'
              # Upload deployment templates
              - Effect: Allow
                Action: [s3:DeleteObject, s3:GetObject*, s3:PutObject*, s3:GetBucket*, s3:List*]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactsBucket}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactsBucket}/*'
              # Download the model files
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !GetAtt ModelBucket.Arn
                  - !Sub '${ModelBucket.Arn}/*'
              # Push the image to the API's repository only
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchDeleteImage
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ImageRepository}'

Outputs:
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationRoleArn:
    Value: !GetAtt CloudFormationRole.Arn
  ModelBucket:
    Value: !Ref ModelBucket
  ArtifactsBucket:
    Value: !Ref ArtifactsBucket
  ImageRepositoryUri:
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/${ImageRepository}'