<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Machine learning over London planning applications: borough refusal rates, a refusal-risk model and an application classifier.">
  <title>PlanScope London</title>
  <style>
    /* Colours for light mode, swapped for dark mode below */
    :root {
      color-scheme: light dark;
      --bg: #ffffff; --fg: #111827; --muted: #6b7280; --border: #d1d5db;
      --accent: #1d4ed8; --bar: #dbeafe; --low: #dbeafe; --high: #1e3a8a; --none: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220; --fg: #e5e7eb; --muted: #9ca3af; --border: #374151;
        --accent: #3b82f6; --bar: #1e3a5f; --low: #1e293b; --high: #93c5fd; --none: #1f2937;
      }
    }
    body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; line-height: 1.5;
           max-width: 42rem; margin: 0 auto; padding: 2rem 1rem; }
    section { margin-top: 2.5rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
    select, textarea, button { font: inherit; color: inherit; }
    select { background: var(--bg); border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.25rem 0.5rem; }
    .note, footer { color: var(--muted); font-size: 0.875rem; }
    a { color: var(--accent); }

    /* Map: borough outlines stay 1px wide however the map is scaled */
    #map { display: block; width: 100%; height: auto; margin-top: 1rem; }
    #map path { stroke: var(--bg); stroke-width: 1px; vector-effect: non-scaling-stroke; cursor: pointer; outline: none; }
    #map path:hover, #map path:focus { stroke: var(--fg); stroke-width: 2px; }
    .legend { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
    .ramp { flex: 1; height: 0.6rem; border-radius: 0.3rem; background: linear-gradient(in oklab to right, var(--low), var(--high)); }
    #borough { min-height: 1.5em; font-weight: 600; }

    /* Forms */
    textarea { box-sizing: border-box; width: 100%; padding: 0.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 0.375rem; }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.75rem; }
    .row > div { flex: 1 1 12rem; }
    .row select { width: 100%; }
    button { cursor: pointer; }
    .primary { background: var(--accent); color: white; border: 0; border-radius: 0.375rem; padding: 0.5rem 1.25rem; margin-top: 0.75rem; }
    .primary:disabled { opacity: 0.6; cursor: wait; }
    .examples { margin-top: 0.5rem; color: var(--muted); }
    .example { background: none; border: 1px solid var(--muted); border-radius: 1rem; padding: 0.1rem 0.6rem; margin: 0.2rem 0.2rem 0 0; }
    ol { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; padding: 0.25rem 0.5rem; margin-bottom: 0.25rem;
         background: linear-gradient(to right, var(--bar) calc(var(--p) * 100%), transparent 0); }
    li::after { content: attr(data-percent); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>PlanScope London</h1>
  <p>Machine learning over <strong id="total">London's</strong> planning applications from the Planning London Datahub.</p>

  <section>
    <h2>How Often Each Borough Refuses</h2>
    <label for="filter">Application Type</label>
    <select id="filter"><option value="all">All Applications</option></select>
    <svg id="map" aria-label="Map of London boroughs shaded by refusal rate"></svg>
    <div class="legend"><span id="min"></span><span class="ramp"></span><span id="max"></span></div>
    <p id="borough" aria-live="polite">Hover over or tap a borough.</p>
    <p class="note">
      Refusal rate = refused ÷ (approved + refused), for applications
